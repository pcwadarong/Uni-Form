enableGlobalCache: false

nodeLinker: pnp

supportedArchitectures:
  cpu:
    - x64
    - arm64
  os:
    - darwin
    - win32

yarnPath: .yarn/releases/yarn-4.10.3.cjs

packageExtensions:
  # Firebase의 내부 compat 패키지들이 서로를 못 찾는 문제를 해결
  "@firebase/analytics-compat@*":
    peerDependencies:
      "@firebase/app": "*"
  "@firebase/app-check-compat@*":
    peerDependencies:
      "@firebase/app": "*"
  "@firebase/auth-compat@*":
    peerDependencies:
      "@firebase/app": "*"
      "@firebase/app-types": "*"
  "@firebase/firestore-compat@*":
    peerDependencies:
      "@firebase/app": "*"
      "@firebase/app-types": "*"
  "@firebase/functions-compat@*":
    peerDependencies:
      "@firebase/app": "*"
  "@firebase/installations-compat@*":
    peerDependencies:
      "@firebase/app": "*"
      "@firebase/app-types": "*"
  "@firebase/messaging-compat@*":
    peerDependencies:
      "@firebase/app": "*"
  "@firebase/performance-compat@*":
    peerDependencies:
      "@firebase/app": "*"
  "@firebase/remote-config-compat@*":
    peerDependencies:
      "@firebase/app": "*"
  "@firebase/storage-compat@*":
    peerDependencies:
      "@firebase/app": "*"
      "@firebase/app-types": "*"